services:
  frontend:
    image: portfolio-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001

  backend:
    image: portfolio-backend
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgresql://user:postgres@postgres:5432/portfolio_db"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm start"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_db
    ports:
      - "3002:5432"
    volumes:
      - portfolio_data:/var/lib/postgresql
    healthcheck:
      test:
            - CMD-SHELL
            - pg_isready -U user -d portfolio_db
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  portfolio_data:
